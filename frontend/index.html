<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemorySearch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center min-h-screen px-4 py-10">

  <h1 class="text-4xl font-semibold text-gray-800 mb-10">MemorySearch</h1>

  <form id="searchForm" class="w-full max-w-xl">
    <div class="flex items-center border-b border-blue-500 py-2">
      <input
        id="queryInput"
        class="appearance-none bg-transparent border-none w-full text-gray-700 mr-3 py-1 px-2 leading-tight focus:outline-none"
        type="text"
        placeholder="Search images by description..."
      />
      <button
        class="flex-shrink-0 bg-blue-500 hover:bg-blue-700 text-white py-1 px-3 rounded"
        type="submit"
      >
        Search
      </button>
    </div>
  </form>

  <!-- LOCAL RESULTS -->
  <div class="w-full max-w-4xl mt-10">
    <h2 class="text-2xl font-semibold text-gray-700 mb-4">Local Results</h2>
    <div id="localResults" class="grid grid-cols-2 md:grid-cols-3 gap-4">
    </div>
  </div>

  <!-- WEB RESULTS -->
  <div class="w-full max-w-4xl mt-10">
    <h2 class="text-2xl font-semibold text-gray-700 mb-4">Web Results</h2>
    <div id="webResults" class="grid grid-cols-2 md:grid-cols-3 gap-4">
    </div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const localDiv = document.getElementById('localResults');
    const webDiv = document.getElementById('webResults');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const query = document.getElementById('queryInput').value;

      const res = await fetch('http://localhost:5000/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });

      const data = await res.json();

      localDiv.innerHTML = '';
      webDiv.innerHTML = '';

      // LOCAL RESULTS
      (data.local_results || []).forEach(path => {
        const img = document.createElement('img');
        img.src = `http://localhost:5000/${path}`;
        img.className = 'w-full rounded shadow';
        localDiv.appendChild(img);
      });

      // WEB RESULTS
      (data.web_results || []).forEach(item => {
        const img = document.createElement('img');
        img.src = `http://localhost:5000/${item.url}`;
        img.className = 'w-full rounded shadow';

        const wrapper = document.createElement('div');

        // optional: show source link
        const link = document.createElement('a');
        link.href = item.source_url;
        link.target = "_blank";
        link.className = "text-xs text-blue-500 block mt-1";
        link.innerText = "source";

        wrapper.appendChild(img);
        wrapper.appendChild(link);

        webDiv.appendChild(wrapper);
      });
    });
  </script>

</body>
</html>
